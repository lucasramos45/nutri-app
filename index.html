<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pamela Souza | Nutri Materno Infantil</title>
  <style>
    :root {
      --bg: #f7f8f6;
      --card: #fff;
      --text: #26332d;
      --muted: #718078;
      --primary: #5f8d78;
      --primary2: #e5f0ea;
      --border: #e3e9e5;
      --danger: #b85c5c
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    button,
    input,
    textarea,
    select {
      font: inherit
    }

    .hidden {
      display: none !important
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px
    }

    .login-card {
      width: min(430px, 100%);
      background: var(--card);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 15px 45px #29463812
    }

    .logo {
      font-weight: 800;
      font-size: 24px
    }

    .logo span {
      color: var(--primary)
    }

    .login p {
      color: var(--muted);
      line-height: 1.5
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 7px
    }

    .field {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      background: #fff
    }

    .field:focus {
      border-color: var(--primary)
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700
    }

    .btn-primary {
      background: var(--primary);
      color: #fff
    }

    .btn-light {
      background: var(--primary2);
      color: var(--primary)
    }

    .btn-danger {
      background: #f8e7e7;
      color: var(--danger)
    }

    header {
      height: 72px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      position: sticky;
      top: 0;
      z-index: 5
    }

    .app {
      display: flex;
      min-height: calc(100vh - 72px)
    }

    aside {
      width: 240px;
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      background: #fff
    }

    main {
      flex: 1;
      padding: 34px 5%;
      max-width: 1200px
    }

    .nav {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      margin-bottom: 4px
    }

    .nav:hover,
    .nav.active {
      background: var(--primary2);
      color: var(--primary)
    }

    .hero {
      margin-bottom: 26px
    }

    .hero h1 {
      font-size: 32px;
      margin: 0 0 8px
    }

    .hero p {
      color: var(--muted);
      margin: 0
    }

    .search {
      display: flex;
      gap: 10px;
      margin: 22px 0
    }

    .search input {
      flex: 1;
      font-size: 17px;
      padding: 16px;
      border-radius: 15px;
      border: 1px solid var(--border)
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      padding: 9px 13px;
      border-radius: 999px;
      cursor: pointer
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 20px
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 17px
    }

    .card p {
      color: #55645c;
      line-height: 1.55
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 9px
    }

    .actions {
      display: flex;
      gap: 7px;
      margin-top: 14px
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px
    }

    .form-card {
      max-width: 760px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px
    }

    .textarea {
      min-height: 190px;
      resize: vertical
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 17px
    }

    .forgot {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center
    }

    .forgot a {
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none
    }

    .forgot a:hover {
      text-decoration: underline
    }

    .forgot p {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
      margin: 8px 0 0
    }

    .userbox {
      position: relative
    }

    #userbtn {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      text-transform: uppercase
    }

    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 245px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 34px #29463822;
      padding: 7px;
      z-index: 20
    }

    .menu-head {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 10px 10px
    }

    .menu-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      text-decoration: none
    }

    .menu-item:hover {
      background: var(--primary2);
      color: var(--primary)
    }

    .menu-item.danger:hover {
      background: #f8e7e7;
      color: var(--danger)
    }

    .menu-note {
      font-size: 11.5px;
      color: var(--muted);
      padding: 2px 10px 8px;
      line-height: 1.45
    }

    .menu-sep {
      border-top: 1px solid var(--border);
      margin: 5px 0
    }

    @media(max-width:760px) {
      aside {
        display: none
      }

      main {
        padding: 25px 18px
      }

      .hero h1 {
        font-size: 26px
      }

      .search {
        flex-direction: column
      }

      header {
        padding: 0 18px
      }

      .grid {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <section id="login" class="login">
    <div class="login-card">
      <div class="logo">Nutri <span>Materno-Infantil</span></div>
      <p>Seu banco pessoal de perguntas e respostas para consultas rápidas.</p>
      <label>Usuário</label>
      <input id="user" class="field" autocomplete="username" placeholder="seu usuário">
      <label>Senha</label>
      <input id="pass" class="field" type="password" autocomplete="current-password" placeholder="sua senha"
        onkeydown="if(event.key==='Enter')login()">

      <!-- Só aparece na primeira vez em cada navegador: depois a chave fica salva aqui mesmo. -->
      <div id="tokbox" class="hidden">
        <label>Chave de acesso</label>
        <div class="menu-note" style="padding:0 0 7px">Pedimos uma única vez neste navegador. Começa com
          <code>github_pat_</code>.</div>
        <input id="tok" class="field" type="password" autocomplete="off" placeholder="cole a chave aqui"
          onkeydown="if(event.key==='Enter')login()">
      </div>

      <button id="loginbtn" class="btn btn-primary" style="width:100%;margin-top:16px" onclick="login()">Entrar</button>
      <p id="loginerr" class="hidden" style="color:var(--danger);font-size:13px;margin:12px 0 0"></p>
      <div class="forgot">
        <p>A senha é definida no próprio código do site.</p>
      </div>
    </div>
  </section>

  <div id="site" class="hidden">
    <header>
      <div class="logo">Nutri <span>Materno-Infantil</span></div>
      <div style="display:flex;align-items:center;gap:14px">
        <span id="sync" class="meta" style="margin:0"></span>
        <div class="userbox">
          <button class="btn btn-light" onclick="toggleMenu(event)" aria-haspopup="true" id="userbtn">
            <span class="avatar" id="avatar">?</span><span id="username">usuário</span> <span
              style="font-size:11px">▾</span>
          </button>
          <div id="usermenu" class="menu hidden">
            <div class="menu-head">Conectada como <b id="username2">usuário</b></div>
            <div class="menu-sep"></div>
            <button class="menu-item danger" onclick="logout()">↩ Sair</button>
          </div>
        </div>
      </div>
    </header>
    <div class="app">
      <aside>
        <button class="nav active" onclick="showHome()">⌂ Início</button>
        <button class="nav" onclick="showAll()">▦ Todas as perguntas</button>
        <button class="nav" onclick="showForm()">＋ Nova pergunta</button>
        <button class="nav" onclick="showCats()">🏷 Categorias</button>
        <hr style="border:0;border-top:1px solid var(--border);margin:18px 0">
        <div style="font-size:12px;color:var(--muted);padding:0 12px">CATEGORIAS</div>
        <div id="navcats"></div>
      </aside>
      <main id="main"></main>
    </div>
  </div>

  <script>
    /* ===== Armazenamento: arquivo dados.json dentro do próprio repositório GitHub ===== */
    const FILE = 'dados.json', BRANCH = 'main', CFG = 'nutri_mi_cfg_v1';
    const DATA_REPO = 'lucasramos45/nutri-dados';

    /* Login fixo: estes valores são visíveis no código-fonte da página, e é o esperado. */
    const LOGIN = { user: 'pamela', pass: '123' };

    /* A chave de acesso NÃO fica no código: se fosse publicada aqui, o secret scanning do
       GitHub a revogaria e o site pararia de salvar. Ela é pedida uma vez por navegador
       e guardada no localStorage. */
    const TOK = 'nutri_mi_tok_v1';
    const lerTok = () => localStorage.getItem(TOK) || '';

    const GH = { repo: DATA_REPO, token: '', user: LOGIN.user, sha: null };
    let ITEMS = [], CATS = [], queue = Promise.resolve();

    /* Categorias usadas quando o arquivo ainda não tem nenhuma cadastrada. */
    const DEMO_CATS = ['Gestação', 'Amamentação', 'Introdução Alimentar', 'Alimentação Nutricional', 'Avaliação', 'Suplementação', 'Nutrientes Nutricionais', 'Alergias Alimentares', 'Outros'];

    const DEMO = [
      { id: 1, cat: 'Diabetes gestacional', q: 'Quais pontos devo conferir quando surge uma dúvida sobre diabetes gestacional?', a: 'Exemplo de registro. Substitua este texto pela orientação técnica que você utiliza e pela referência correspondente. Este conteúdo é apenas um modelo do sistema.', tags: 'diabetes gestacional, glicemia, gestação', source: 'Adicionar fonte/referência' },
      { id: 2, cat: 'Introdução alimentar', q: 'Como registrar uma dúvida sobre a introdução alimentar?', a: 'Exemplo de registro. Cadastre aqui a sua resposta técnica, observações práticas e a fonte utilizada.', tags: 'introdução alimentar, bebê, alimentação', source: 'Adicionar fonte/referência' },
      { id: 3, cat: 'Amamentação', q: 'Onde guardar orientações importantes sobre amamentação?', a: 'Use este campo para guardar a resposta que você revisou, juntamente com sua fonte ou protocolo.', tags: 'amamentação, leite materno', source: 'Adicionar fonte/referência' }
    ];
    /* base64 <-> texto preservando acentos */
    function b64enc(s) { return btoa(String.fromCharCode(...new TextEncoder().encode(s))) }
    function b64dec(s) { return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0))) }

    /* url relativa à API; allow404 só é usado na leitura inicial, onde 404 = arquivo ainda não existe */
    async function api(method, path, body, allow404) {
      const r = await fetch(`https://api.github.com/repos/${GH.repo}${path}`,
        {
          method, headers: { Authorization: `Bearer ${GH.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
          body: body ? JSON.stringify(body) : undefined, cache: 'no-store'
        });
      if (r.status === 404) {
        if (allow404) return null;
        throw new Error(`Repositório ${GH.repo} não encontrado. Confira o nome (usuario/repositorio) e se o token tem acesso a ele.`);
      }
      if (r.status === 401) throw new Error('Token inválido ou expirado.');
      if (r.status === 403) throw new Error('O token não tem permissão de escrita (precisa de Contents: Read and write neste repositório).');
      if (r.status === 409 || r.status === 422) throw new Error('O arquivo mudou em outro lugar. Recarregue a página antes de salvar.');
      if (!r.ok) throw new Error(`Erro do GitHub (${r.status}). Verifique o repositório e a conexão.`);
      return r.json();
    }
    const contents = (m, body, allow404) => api(m, `/contents/${FILE}` + (m === 'GET' ? `?ref=${BRANCH}&t=${Date.now()}` : ''), body, allow404);

    async function pull() {
      await api('GET', '');            // confirma que o repositório existe e o token alcança ele
      const f = await contents('GET', null, true);
      if (!f) { ITEMS = DEMO.slice(); CATS = novasCats(DEMO_CATS); GH.sha = null; await push('cria dados.json'); return }
      GH.sha = f.sha;
      let p;
      try { p = JSON.parse(b64dec(f.content)) }
      catch (e) { throw new Error('O arquivo dados.json existe mas não é um JSON válido.') }
      /* Formato antigo: o arquivo era só a lista de perguntas. */
      ITEMS = Array.isArray(p) ? p : (Array.isArray(p?.items) ? p.items : []);
      const salvas = Array.isArray(p?.cats) ? p.cats : [];
      CATS = salvas.length ? salvas.map(c => (typeof c === 'string' ? { id: novoCatId(), name: c } : c))
        : novasCats(unicos([...DEMO_CATS, ...ITEMS.map(x => x.cat).filter(Boolean)]));
    }

    /* Mantém a primeira grafia de cada nome: as padrão vencem as variações vindas das perguntas. */
    function unicos(nomes) {
      const vistos = new Map();
      for (const n of nomes) { const k = n.trim().toLowerCase(); if (!vistos.has(k)) vistos.set(k, n.trim()) }
      return [...vistos.values()];
    }

    /* Ids de categoria não podem colidir quando várias são criadas no mesmo milissegundo. */
    let seqCat = 0;
    function novoCatId() { return `c${Date.now()}${(++seqCat).toString(36)}` }
    function novasCats(nomes) { return nomes.map(n => ({ id: novoCatId(), name: n })) }

    async function push(msg) {
      const conteudo = { cats: CATS, items: ITEMS };
      const res = await contents('PUT', { message: msg, content: b64enc(JSON.stringify(conteudo, null, 2)), branch: BRANCH, ...(GH.sha ? { sha: GH.sha } : {}) });
      GH.sha = res?.content?.sha || null;
    }

    function sync(t, err) { const el = document.getElementById('sync'); if (el) { el.textContent = t; el.style.color = err ? 'var(--danger)' : 'var(--muted)' } }

    function data() { return ITEMS }
    /* Sempre em ordem alfabética (pt-BR, ignorando acentos e maiúsculas), então uma categoria
       nova já aparece no lugar certo sem precisar reordenar nada na mão. */
    function cats() { return [...CATS].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' })) }
    function catNames() { return cats().map(c => c.name) }
    /* Salva em memória e envia ao GitHub; desfaz a alteração local se o envio falhar. */
    function save(x, novasCategorias, msg) {
      const prevI = ITEMS, prevC = CATS;
      if (x) ITEMS = x;
      if (novasCategorias) CATS = novasCategorias;
      sync('Salvando…');
      queue = queue.then(() => push(msg || 'atualiza perguntas e respostas'))
        .then(() => sync('Salvo no GitHub'))
        .catch(e => { ITEMS = prevI; CATS = prevC; sync('Falha ao salvar', 1); alert(e.message + '\n\nA alteração não foi salva.'); refresh() });
      return queue;
    }
    function refresh() { renderNavCats(); showHome() }

    /* ===== Login: compara usuário e senha com os valores fixos acima ===== */
    /* Mostra o campo da chave só quando este navegador ainda não tem uma guardada. */
    if (!lerTok()) document.getElementById('tokbox').classList.remove('hidden');

    async function login() {
      const btn = document.getElementById('loginbtn'), err = document.getElementById('loginerr');
      const user = document.getElementById('user').value, pass = document.getElementById('pass').value;
      err.classList.add('hidden');
      const falha = m => { err.textContent = m; err.classList.remove('hidden') };
      if (!user.trim() || !pass) return falha('Informe o usuário e a senha.');
      if (user.trim().toLowerCase() !== LOGIN.user || pass !== LOGIN.pass) return falha('Usuário ou senha inválidos.');

      /* A chave digitada agora vale para esta sessão; só é guardada se realmente funcionar. */
      const novo = document.getElementById('tok').value.trim();
      const tok = novo || lerTok();
      if (!tok) return falha('Cole a chave de acesso para entrar pela primeira vez neste navegador.');
      if (!/^(github_pat_|ghp_)/.test(tok)) return falha('Essa chave não parece certa — ela começa com github_pat_.');

      btn.disabled = true; btn.textContent = 'Entrando…';
      GH.token = tok;
      try {
        await pull();
        localStorage.setItem(TOK, tok);
        localStorage.setItem(CFG, '1');
        document.getElementById('tok').value = '';
        openSite();
      } catch (e) { GH.token = ''; falha(e.message) }
      finally { btn.disabled = false; btn.textContent = 'Entrar' }
    }
    function openSite() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('site').classList.remove('hidden');
      const u = GH.user || 'usuário';
      document.getElementById('username').textContent = u;
      document.getElementById('username2').textContent = u;
      document.getElementById('avatar').textContent = u.charAt(0);
      sync(`${ITEMS.length} registros`); renderNavCats(); showHome();
    }
    function toggleMenu(e) { e.stopPropagation(); document.getElementById('usermenu').classList.toggle('hidden') }
    document.addEventListener('click', e => {
      const m = document.getElementById('usermenu');
      if (m && !m.classList.contains('hidden') && !e.target.closest('.userbox')) m.classList.add('hidden');
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('usermenu')?.classList.add('hidden') });
    /* Sair encerra a sessão mas mantém a chave, para não pedir de novo neste navegador. */
    function logout() { localStorage.removeItem(CFG); location.reload() }

    /* Reabre direto se este navegador já entrou antes e ainda tem a chave guardada. */
    (async () => {
      if (!localStorage.getItem(CFG) || !lerTok()) return;
      GH.token = lerTok();
      try {
        await pull(); openSite();
      } catch (e) {
        /* Chave recusada: descarta a guardada e pede outra, senão o campo nunca reaparece. */
        localStorage.removeItem(CFG); GH.token = '';
        if (/inválid|expirad|permissão/i.test(e.message)) {
          localStorage.removeItem(TOK);
          document.getElementById('tokbox').classList.remove('hidden');
        }
        const el = document.getElementById('loginerr'); el.textContent = e.message; el.classList.remove('hidden');
      }
    })();

    function shell(title, sub, body) { document.getElementById('main').innerHTML = `<div class="topbar"><div><h1 style="margin:0;font-size:25px">${title}</h1><p style="color:var(--muted);margin:5px 0">${sub}</p></div><button class="btn btn-primary" onclick="showForm()">＋ Nova pergunta</button></div>${body}` }
    function showHome() {
      shell('Olá! 👋', 'Pesquise uma palavra-chave ou descreva rapidamente a sua dúvida.',
        `<div class="search"><input id="search" placeholder="Ex.: diabetes gestacional, ferro, mel, glicemia..." onkeydown="if(event.key==='Enter')doSearch()"><button class="btn btn-primary" onclick="doSearch()">Pesquisar</button></div>
 <div class="categories">${cats().map(c => `<button class="chip" onclick="searchCatId('${c.id}')">${esc(c.name)}</button>`).join('')}</div>
 <div id="results"></div>`);
      renderResults(data().slice(0, 6), 'Perguntas recentes');
    }
    function doSearch() { let q = document.getElementById('search').value.trim().toLowerCase(); if (!q) { renderResults(data().slice(0, 6), 'Perguntas recentes'); return } let terms = q.split(/\s+/); let r = data().filter(x => terms.some(t => (x.q + ' ' + x.a + ' ' + x.tags + ' ' + x.cat).toLowerCase().includes(t))); renderResults(r, `Resultados para “${q}”`) }
    function searchCat(cat) { showHome(); document.getElementById('search').value = cat; let r = data().filter(x => x.cat === cat); renderResults(r, cat) }
    function searchCatId(id) { const c = cats().find(y => y.id === id); if (c) searchCat(c.name) }
    function renderNavCats() {
      const el = document.getElementById('navcats'); if (!el) return;
      el.innerHTML = cats().length
        ? cats().map(c => `<button class="nav" onclick="searchCatId('${c.id}')">${esc(c.name)}</button>`).join('')
        : `<div class="menu-note">Nenhuma categoria cadastrada.</div>`;
    }
    function showAll() { shell('Todas as perguntas', 'Seu banco de conhecimento.', '<div id="results"></div>'); renderResults(data(), 'Todas as perguntas') }
    function renderResults(items, title) { let el = document.getElementById('results'); if (!el) return; el.innerHTML = `<h2 style="font-size:18px">${title}</h2>` + (items.length ? `<div class="grid">${items.map(card).join('')}</div>` : `<div class="empty">Nenhum conteúdo encontrado.<br><br>Você pode cadastrar uma nova pergunta.</div>`) }
    function card(x) { return `<article class="card"><div class="meta">${x.cat}</div><h3>${x.q}</h3><p>${x.a.length > 180 ? x.a.slice(0, 180) + '…' : x.a}</p><div class="meta">🔎 ${x.tags}</div><div class="actions"><button class="btn btn-light" onclick="view(${x.id})">Ver resposta</button><button class="btn" style="background:#f4f5f4" onclick="edit(${x.id})">Editar</button></div></article>` }
    function view(id) { let x = data().find(y => y.id === id); shell(x.cat, x.q, `<div class="form-card"><div class="meta">RESPOSTA</div><div style="white-space:pre-wrap;line-height:1.7">${esc(x.a)}</div><hr style="border:0;border-top:1px solid var(--border);margin:22px 0"><b>Palavras-chave</b><p class="meta">${esc(x.tags)}</p><b>Fonte/referência</b><p class="meta">${esc(x.source || 'Não cadastrada')}</p><div class="actions"><button class="btn btn-light" onclick="edit(${x.id})">Editar</button><button class="btn btn-danger" onclick="removeItem(${x.id})">Excluir</button></div></div>`) }
    function showForm(id = null) {
      let x = id ? data().find(y => y.id === id) : { cat: '', q: '', a: '', tags: '', source: '' };
      /* A categoria atual do registro entra na lista mesmo se tiver sido excluída, para não trocar sozinha. */
      const opcoes = [...new Set([...catNames(), ...(x.cat ? [x.cat] : [])])];
      shell(id ? 'Editar pergunta' : 'Nova pergunta', 'Cadastre uma dúvida para encontrar rapidamente no futuro.', `<div class="form-card">
<label>Categoria</label>${opcoes.length ? `<select id="fcat" class="field">${opcoes.map(c => `<option value="${escAttr(c)}">${esc(c)}</option>`).join('')}</select>`
          : `<input id="fcat" class="field" value="" placeholder="Cadastre uma categoria na tela Categorias">`}
<label>Pergunta</label><input id="fq" class="field" value="${escAttr(x.q)}" placeholder="Ex.: Pode oferecer mel para menores de 1 ano?">
<label>Resposta</label><textarea id="fa" class="field textarea" placeholder="Digite a resposta técnica revisada...">${esc(x.a)}</textarea>
<label>Palavras-chave</label><input id="ftags" class="field" value="${escAttr(x.tags)}" placeholder="Ex.: mel, bebê, botulismo, introdução alimentar">
<label>Fonte / referência</label><input id="fsource" class="field" value="${escAttr(x.source)}" placeholder="Ex.: diretriz, protocolo, artigo...">
<div class="actions"><button class="btn btn-primary" onclick="saveForm(${id || 'null'})">Salvar</button><button class="btn btn-light" onclick="showHome()">Cancelar</button></div></div>`);
      document.getElementById('fcat').value = x.cat || opcoes[0] || ''
    }
    function saveForm(id) { let arr = data(); let obj = { id: id || Date.now(), cat: document.getElementById('fcat').value, q: document.getElementById('fq').value.trim(), a: document.getElementById('fa').value.trim(), tags: document.getElementById('ftags').value.trim(), source: document.getElementById('fsource').value.trim() }; if (!obj.q || !obj.a) { alert('Preencha a pergunta e a resposta.'); return } if (!obj.cat.trim()) { alert('Escolha uma categoria. Cadastre uma na tela Categorias.'); return } if (id) { let i = arr.findIndex(x => x.id === id); arr[i] = obj } else arr.unshift(obj); save(arr); view(obj.id) }
    function edit(id) { showForm(id) }
    function removeItem(id) { if (confirm('Excluir esta pergunta?')) { save(data().filter(x => x.id !== id)); showAll() } }
    /* ===== CRUD de categorias ===== */
    let editandoCat = null;               // id da categoria em edição na lista

    function usoCat(nome) { return data().filter(x => x.cat === nome).length }
    function catDuplicada(nome, ignorarId) {
      const n = nome.trim().toLowerCase();
      return cats().some(c => c.id !== ignorarId && c.name.trim().toLowerCase() === n);
    }

    function showCats() {
      editandoCat = null;
      shell('Categorias', 'Organize os assuntos usados nas perguntas.', `<div class="form-card">
<label for="newcat">Nova categoria</label>
<div class="search" style="margin:0">
  <input id="newcat" class="field" placeholder="Ex.: Alergias alimentares" onkeydown="if(event.key==='Enter')addCat()">
  <button class="btn btn-primary" onclick="addCat()">Adicionar</button>
</div>
</div>
<div id="catlist" style="margin-top:18px"></div>`);
      renderCatList();
    }

    function renderCatList() {
      const el = document.getElementById('catlist'); if (!el) return;
      if (!cats().length) { el.innerHTML = `<div class="empty">Nenhuma categoria cadastrada.<br><br>Adicione a primeira no campo acima.</div>`; return }
      el.innerHTML = `<div class="grid">${cats().map(c => {
        const n = usoCat(c.name);
        const uso = `${n} ${n === 1 ? 'pergunta' : 'perguntas'}`;
        if (editandoCat === c.id) return `<article class="card">
<div class="meta">EDITANDO</div>
<input id="editcat" class="field" value="${escAttr(c.name)}" onkeydown="if(event.key==='Enter')saveCat('${c.id}');if(event.key==='Escape')cancelCat()">
<div class="actions"><button class="btn btn-primary" onclick="saveCat('${c.id}')">Salvar</button><button class="btn btn-light" onclick="cancelCat()">Cancelar</button></div></article>`;
        return `<article class="card">
<div class="meta">${uso}</div><h3>${esc(c.name)}</h3>
<div class="actions">
  <button class="btn btn-light" onclick="searchCatId('${c.id}')">Ver perguntas</button>
  <button class="btn" style="background:#f4f5f4" onclick="editCat('${c.id}')">Editar</button>
  <button class="btn btn-danger" onclick="removeCat('${c.id}')">Excluir</button>
</div></article>`;
      }).join('')}</div>`;
      document.getElementById('editcat')?.focus();
    }

    function addCat() {
      const inp = document.getElementById('newcat'); const nome = inp.value.trim();
      if (!nome) { alert('Digite o nome da categoria.'); return }
      if (catDuplicada(nome)) { alert('Já existe uma categoria com esse nome.'); return }
      inp.value = '';
      save(null, [...cats(), { id: novoCatId(), name: nome }], `adiciona categoria ${nome}`);
      renderNavCats(); renderCatList();
    }

    function editCat(id) { editandoCat = id; renderCatList() }
    function cancelCat() { editandoCat = null; renderCatList() }

    /* Renomear precisa arrastar as perguntas junto: elas guardam o nome da categoria, não o id. */
    function saveCat(id) {
      const atual = cats().find(c => c.id === id); if (!atual) return;
      const nome = document.getElementById('editcat').value.trim();
      if (!nome) { alert('Digite o nome da categoria.'); return }
      if (catDuplicada(nome, id)) { alert('Já existe uma categoria com esse nome.'); return }
      editandoCat = null;
      if (nome === atual.name) { renderCatList(); return }
      const novasCategorias = cats().map(c => c.id === id ? { ...c, name: nome } : c);
      const novosItens = data().map(x => x.cat === atual.name ? { ...x, cat: nome } : x);
      save(novosItens, novasCategorias, `renomeia categoria ${atual.name} para ${nome}`);
      renderNavCats(); renderCatList();
    }

    function removeCat(id) {
      const c = cats().find(y => y.id === id); if (!c) return;
      const n = usoCat(c.name);
      if (n) { alert(`“${c.name}” está em uso por ${n} ${n === 1 ? 'pergunta' : 'perguntas'}.\n\nMova essas perguntas para outra categoria antes de excluir.`); return }
      if (!confirm(`Excluir a categoria “${c.name}”?`)) return;
      save(null, cats().filter(y => y.id !== id), `remove categoria ${c.name}`);
      renderNavCats(); renderCatList();
    }

    function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) }
    function escAttr(s) { return esc(s).replace(/\n/g, '&#10;') }
  </script>
</body>

</html>
